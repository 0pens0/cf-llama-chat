---
applications:
  - name: cf-llama-chat
    memory: 1G
    instances: 1
    path: target/cf-llama-chat-1.0.0-SNAPSHOT.jar
    buildpacks:
      - java_buildpack_offline
    env:
      JBP_CONFIG_OPEN_JDK_JRE: '{ jre: { version: 21.+ } }'
      SPRING_PROFILES_ACTIVE: cloud
      APP_AUTH_SECRET: changeme
    services:
      - cf-llama-chat-db
      # - tanzu-all-models
      # Individual model bindings (use these if not using tanzu-all-models/"multi-model" plan)
      - OpenAI-Private-GPToss(CPU)
      - OpenAI-GPT5
      - Claude-3.5-Haiku
      - vPAIF-Llama-3.1
      - tnazu-internal-gpt-oss-20b
      - vPAIF-GPToss
      - cf-llama-chat-sso
